<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Circle Game</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
canvas { display: block; width: 100vw; height: 100vh; background: #000; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
function setSize() { canvas.width = window.innerWidth || 800; canvas.height = window.innerHeight || 600; }
setSize();
window.addEventListener("resize", setSize);

const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
window.addEventListener("mousemove", function(e) {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left;
  mouse.y = e.clientY - rect.top;
});

const player = { x: canvas.width / 2, y: canvas.height / 2, radius: 25, baseSpeed: 260, speed: 260, color: "#9b30ff" };
const keys = { w: false, a: false, s: false, d: false };

let health = 100, maxHealth = 100;
let enemies = [], enemyBullets = [], projectiles = [], smokeBombs = [], fireOrbs = [];
let iceSpikes = [], blizzardFields = [], meleeSlashes = [], bombExplosions = [], landMines = [];
let buhBullets = [], buhShrines = [], shrineSlashFx = [], grassShards = [], grassFields = [];
let lightningBolts = [], lightningStrikes = [], mechanicClaws = [], kaiOrbs = [], kaiFields = [], particleFx = [], starfield = [];
let enemySpawnTimer = 0;
const enemySpawnInterval = 1.5;
let lastTime = performance.now();
let bgTime = 0;

let inHome = true, homeT = 0, homeBalls = [], homeFx = [];

let cutscene = null;
let screenShake = 0;

let gachaState = "idle";
let gachaTimer = 0;
let gachaResult = null;

let bossesDefeated = 0;

for (let i = 0; i < 120; i++) {
  starfield.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, r: Math.random() * 1.6 + 0.3, a: Math.random() * 0.5 + 0.2, tw: Math.random() * Math.PI * 2 });
}

let isPaused = false, currentScreen = "game";
let currentWave = 1, enemiesKilledCurrentWave = 0, enemiesSpawnedCurrentWave = 0, enemiesToSpawnThisWave = 0;
let totalKills = 0;
const MAX_ACTIVE_ENEMIES_ON_SCREEN = 8;

let equippedElement = "sand";
let unlockedElements = { sand: true, smoke: false, flame: false, blizzard: false, bomb: false, buh: false, grass: false, lightning: false, mechanic: false, kai: false, polar: false };
let lastRollResult = "", lastRollColor = "#ffd700", money = 0, nextEnemyId = 1;

try {
  const raw = localStorage.getItem("purple_circle_persistent_save");
  if (raw) {
    const data = JSON.parse(raw);
    if (data && typeof data === "object") {
      money = typeof data.money === "number" ? data.money : 0;
      maxHealth = typeof data.maxHealth === "number" ? data.maxHealth : 100;
      equippedElement = data.equippedElement || "sand";
      totalKills = typeof data.totalKills === "number" ? data.totalKills : 0;
      bossesDefeated = typeof data.bossesDefeated === "number" ? data.bossesDefeated : 0;
      if (data.unlockedElements) {
        unlockedElements.sand = true;
        if (data.unlockedElements.smoke) unlockedElements.smoke = true;
        if (data.unlockedElements.flame) unlockedElements.flame = true;
        if (data.unlockedElements.blizzard) unlockedElements.blizzard = true;
        if (data.unlockedElements.bomb) unlockedElements.bomb = true;
        if (data.unlockedElements.buh) unlockedElements.buh = true;
        if (data.unlockedElements.grass) unlockedElements.grass = true;
        if (data.unlockedElements.lightning) unlockedElements.lightning = true;
        if (data.unlockedElements.mechanic) unlockedElements.mechanic = true;
        if (data.unlockedElements.kai) unlockedElements.kai = true;
        if (data.unlockedElements.polar) unlockedElements.polar = true;
      }
      currentWave = typeof data.currentWave === "number" ? data.currentWave : 1;
    }
  }
} catch (e) { localStorage.removeItem("purple_circle_persistent_save"); }

// Mechanic is no longer obtainable; fall back to Sand if an old save had it equipped
if (!unlockedElements[equippedElement] || equippedElement === "mechanic") equippedElement = "sand";
health = maxHealth;

function saveGameData() {
  try {
    localStorage.setItem("purple_circle_persistent_save", JSON.stringify({
      money: money, maxHealth: maxHealth, equippedElement: equippedElement,
      unlockedElements: unlockedElements, currentWave: currentWave, totalKills: totalKills,
      bossesDefeated: bossesDefeated
    }));
  } catch (e) {}
}

function getKillsRequiredForWave(wave) { return 5 + (wave - 1) * 2; }
function isBossWave(wave) { return wave % 5 === 0; }
function getMoneyPerKill() { return 1 + Math.floor((currentWave - 1) / 3); }
function getBossHp() { return 1000 + bossesDefeated * 500; }

let beamCooldownTimer = 0, activeLaser = null;
let auraCooldownTimer = 0, auraActiveTimer = 0, auraDamageTickTimer = 0;
let smokeShotCooldownTimer = 0, smokeDashCooldownTimer = 0, smokeDashActiveTimer = 0, smokeBombSpawnTimer = 0;
let flameSpinActiveTimer = 0, flameSpinCooldownTimer = 0, flameSpinAngle = 0, flameSpinTickTimer = 0;
let flameOrbCooldownTimer = 0;
let iceSpikeCooldownTimer = 0, blizzardFieldCooldownTimer = 0;
let meleeCooldownTimer = 0;
let bombMiniCooldownTimer = 0, bombBigCooldownTimer = 0;
let buhBarrageCooldownTimer = 0, buhShrineCooldownTimer = 0;
let grassShotCooldownTimer = 0, grassFieldCooldownTimer = 0;
let lightningBoltCooldownTimer = 0, lightningStormCooldownTimer = 0;
let mechanicClawCooldownTimer = 0, mechanicSpinCooldownTimer = 0, mechanicSpinActiveTimer = 0, mechanicSpinTickTimer = 0, mechanicSpinAngle = 0;
let kaiOrbCooldownTimer = 0, kaiFieldCooldownTimer = 0;

// ---- POLAR ----
let polarFrostActiveTimer = 0, polarFrostCooldownTimer = 0, polarFrostTickTimer = 0, polarFrostAge = 0;
let polarLaserActiveTimer = 0, polarLaserCooldownTimer = 0, polarLaserAngle = 0;
const POLAR_FROST_DAMAGE = 300, POLAR_FROST_TICK = 0.07, POLAR_FROST_DURATION = 8.0, POLAR_FROST_COOLDOWN = 15.0;
const POLAR_LASER_DAMAGE = 500, POLAR_LASER_WIDTH = 64, POLAR_LASER_SPIN = 4, POLAR_LASER_DURATION = 8.0, POLAR_LASER_COOLDOWN = 8.5, POLAR_LASER_HIT_INTERVAL = 0.3;
function polarLaserLength() { return Math.max(380, Math.min(canvas.width, canvas.height) * 0.6); }
function distToSegment(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  let t = l2 === 0 ? 0 : ((px - x1) * dx + (py - y1) * dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// ---- ELEMENTAL ENEMIES (wave 6+; never Kai / Buh / Blizzard / Polar) ----
const ELEMENTAL_ENEMY_DAMAGE = 6;
const ELEMENTAL_SPAWN_CHANCE = 0.25;
const ELEMENTAL_AURAS = { sand: "#d9b84a", smoke: "#8fa3b8", grass: "#4ec44e", bomb: "#ff9a3c", flame: "#ff4500", lightning: "#c060ff" };
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + a + ")";
}

// ---- GACHA ----
const GACHA_TABLE = [
  { key: "sand", name: "SAND", chance: 27, color: "#cca700" },
  { key: "smoke", name: "SMOKE", chance: 17, color: "#00bfff" },
  { key: "grass", name: "GRASS", chance: 14, color: "#4ec44e" },
  { key: "kai", name: "KAI", chance: 11, color: "#d870ff" },
  { key: "bomb", name: "BOMB", chance: 5, color: "#ffcc00" },
  { key: "flame", name: "FLAME", chance: 5, color: "#ff4500" },
  { key: "lightning", name: "LIGHTNING", chance: 4, color: "#c060ff" },
  { key: "blizzard", name: "BLIZZARD", chance: 1, color: "#7ec8ff" },
  { key: "buh", name: "BUH", chance: 0.1, color: "#ff2288" },
  { key: "polar", name: "POLAR", chance: 0.05, color: "#d0f8ff" },
  { key: "stat", name: "STAT BOOST", chance: 15.85, color: "#20c95c" }
];
function gachaLayout() {
  const cy = canvas.height / 2 - 120;
  return {
    cy: cy,
    roll: { x: canvas.width / 2 - 206, y: cy + 80, w: 200, h: 45 },
    fast: { x: canvas.width / 2 + 6, y: cy + 80, w: 200, h: 45 }
  };
}
let vBoostActiveTimer = 0, vBoostCooldownTimer = 0, vBoostMultiplier = 1;

function resetGame() {
  currentWave = 1; enemiesKilledCurrentWave = 0; enemiesSpawnedCurrentWave = 0;
  enemiesToSpawnThisWave = 0; health = maxHealth;
  enemies = []; enemyBullets = []; projectiles = []; smokeBombs = []; fireOrbs = [];
  iceSpikes = []; blizzardFields = []; meleeSlashes = []; bombExplosions = []; landMines = [];
  buhBullets = []; buhShrines = []; shrineSlashFx = []; grassShards = []; grassFields = [];
  lightningBolts = []; lightningStrikes = []; mechanicClaws = []; kaiOrbs = []; kaiFields = []; particleFx = [];
  beamCooldownTimer = 0; auraCooldownTimer = 0; auraActiveTimer = 0;
  smokeShotCooldownTimer = 0; smokeDashCooldownTimer = 0; smokeDashActiveTimer = 0;
  flameSpinActiveTimer = 0; flameSpinCooldownTimer = 0; flameOrbCooldownTimer = 0;
  iceSpikeCooldownTimer = 0; blizzardFieldCooldownTimer = 0; meleeCooldownTimer = 0;
  bombMiniCooldownTimer = 0; bombBigCooldownTimer = 0;
  buhBarrageCooldownTimer = 0; buhShrineCooldownTimer = 0;
  grassShotCooldownTimer = 0; grassFieldCooldownTimer = 0;
  lightningBoltCooldownTimer = 0; lightningStormCooldownTimer = 0;
  mechanicClawCooldownTimer = 0; mechanicSpinCooldownTimer = 0; mechanicSpinActiveTimer = 0;
  kaiOrbCooldownTimer = 0; kaiFieldCooldownTimer = 0;
  polarFrostActiveTimer = 0; polarFrostCooldownTimer = 0; polarFrostTickTimer = 0; polarFrostAge = 0;
  polarLaserActiveTimer = 0; polarLaserCooldownTimer = 0;
  vBoostActiveTimer = 0; vBoostCooldownTimer = 0; vBoostMultiplier = 1;
  activeLaser = null;
  isPaused = false; currentScreen = "game";
  player.x = canvas.width / 2; player.y = canvas.height / 2;
  player.speed = player.baseSpeed;
  saveGameData();
}

function goToLobby() {
  resetGame();
  inHome = true;
  homeBalls = [];
  homeFx = [];
  homeT = 0;
  cutscene = null;
  screenShake = 0;
}

function startCutscene(type, duration, data) {
  cutscene = { type: type, timer: duration, maxTimer: duration, data: data || {} };
}

function startWave() {
  enemiesKilledCurrentWave = 0; enemiesSpawnedCurrentWave = 0;
  enemiesToSpawnThisWave = getKillsRequiredForWave(currentWave);
  if (isBossWave(currentWave)) {
    enemiesToSpawnThisWave += 1;
    startCutscene("bossIntro", 2.2, { bossNum: bossesDefeated + 1 });
    screenShake = 1.0;
  }
}

function spawnEnemy() {
  if (enemiesSpawnedCurrentWave >= enemiesToSpawnThisWave) return;
  if (enemies.length >= MAX_ACTIVE_ENEMIES_ON_SCREEN) return;
  const rand = Math.random();
  let type = "normal", radius = 12, speed = 110, damage = 25;
  let hp = 100 + (currentWave - 1) * 25, color = "#ff3333";
  let isBoss = false, isTank = false, isRusher = false, element = null;
  if (isBossWave(currentWave) && !enemies.some(function(e){ return e.isBoss; }) && enemiesSpawnedCurrentWave === 0) {
    isBoss = true; type = "boss"; radius = 40; speed = 60; damage = 40; hp = getBossHp(); color = "#a020f0";
  } else if (currentWave > 5 && Math.random() < ELEMENTAL_SPAWN_CHANCE) {
    const elKeys = Object.keys(ELEMENTAL_AURAS);
    element = elKeys[Math.floor(Math.random() * elKeys.length)];
    type = "elemental"; radius = 13; damage = ELEMENTAL_ENEMY_DAMAGE; color = ELEMENTAL_AURAS[element];
  } else if (currentWave >= 5 && rand < 0.15) {
    isTank = true; type = "tank"; radius = 22; speed = 70; damage = 35;
    hp = 300 + (currentWave - 5) * 20; color = "#3ea663";
  } else if (currentWave >= 4 && rand < 0.32) {
    isRusher = true; type = "rusher"; radius = 14; speed = 160; damage = 30;
    hp = 180 + (currentWave - 4) * 18; color = "#dd44dd";
  } else if (currentWave >= 2 && rand < 0.6) {
    type = "fast"; radius = 9; speed = 200; damage = 20;
    hp = 70 + (currentWave - 1) * 12; color = "#ff9900";
  }
  let x, y;
  if (Math.random() < 0.5) { x = Math.random() < 0.5 ? -radius : canvas.width + radius; y = Math.random() * canvas.height; }
  else { x = Math.random() * canvas.width; y = Math.random() < 0.5 ? -radius : canvas.height + radius; }
  enemies.push({
    id: nextEnemyId++, type: type, isBoss: isBoss, isTank: isTank, isRusher: isRusher,
    x: x, y: y, radius: radius, speed: speed, baseSpeed: speed,
    color: color, damage: damage, element: element,
    maxHealth: hp, health: hp, hitCooldown: 0, freezeTimer: 0,
    shootTimer: isBoss ? 1.5 : 0, dashTimer: isRusher ? 2.0 : 0, dashing: false,
    pulsePhase: Math.random() * Math.PI * 2
  });
  enemiesSpawnedCurrentWave++;
}

function onEnemyKilled(enemy) {
  enemiesKilledCurrentWave++;
  totalKills++;
  money += getMoneyPerKill();
  if (enemy && enemy.isBoss) {
    bossesDefeated++;
    startCutscene("bossDefeated", 1.8, {});
    screenShake = 0.8;
  }
  saveGameData();
  if (enemiesKilledCurrentWave >= getKillsRequiredForWave(currentWave)) {
    currentWave++;
    startWave();
    saveGameData();
  }
}

function spawnParticles(x, y, count, color, speed, life, size) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = speed * (0.4 + Math.random() * 0.8);
    particleFx.push({
      x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: life * (0.7 + Math.random() * 0.6), maxLife: life,
      color: color, size: size * (0.5 + Math.random() * 0.8)
    });
  }
}

function useVBoost() {
  if (isPaused || cutscene) return;
  if (vBoostCooldownTimer > 0) return;
  if (totalKills < 50) return;
  if (totalKills >= 100) {
    vBoostActiveTimer = 5.0; vBoostMultiplier = 3.0; vBoostCooldownTimer = 8.0;
    if (equippedElement === "sand") { beamCooldownTimer = 0; auraCooldownTimer = 0; }
    else if (equippedElement === "smoke") { smokeShotCooldownTimer = 0; smokeDashCooldownTimer = 0; }
    else if (equippedElement === "flame") { flameSpinCooldownTimer = 0; flameOrbCooldownTimer = 0; }
    else if (equippedElement === "blizzard") { iceSpikeCooldownTimer = 0; blizzardFieldCooldownTimer = 0; }
    else if (equippedElement === "bomb") { bombMiniCooldownTimer = 0; bombBigCooldownTimer = 0; }
    else if (equippedElement === "buh") { buhBarrageCooldownTimer = 0; buhShrineCooldownTimer = 0; }
    else if (equippedElement === "grass") { grassShotCooldownTimer = 0; grassFieldCooldownTimer = 0; }
    else if (equippedElement === "lightning") { lightningBoltCooldownTimer = 0; lightningStormCooldownTimer = 0; }
    else if (equippedElement === "mechanic") { mechanicClawCooldownTimer = 0; mechanicSpinCooldownTimer = 0; mechanicSpinActiveTimer = 0; }
    else if (equippedElement === "kai") { kaiOrbCooldownTimer = 0; kaiFieldCooldownTimer = 0; }
    else if (equippedElement === "polar") { polarFrostCooldownTimer = 0; polarLaserCooldownTimer = 0; }
    spawnParticles(player.x, player.y, 40, "#00ffff", 320, 0.7, 5);
  } else {
    vBoostActiveTimer = 4.0; vBoostMultiplier = 2.0; vBoostCooldownTimer = 6.0;
    spawnParticles(player.x, player.y, 25, "#ffee55", 250, 0.6, 4);
  }
}

function useMelee() {
  if (isPaused || cutscene) return;
  if (meleeCooldownTimer > 0) return;
  const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
  const configs = {
    flame:    { reach: 110, arc: Math.PI * 0.7,  dmg: 150, cd: 1.0, color: "rgba(255, 100, 0, 0.85)", inner: "#ffff00", parts: "#ffcc44" },
    blizzard: { reach: 200, arc: Math.PI * 0.6,  dmg: 120, cd: 0.5, color: "rgba(120, 200, 255, 0.85)", inner: "#e6f6ff", parts: "#aee4ff", freeze: 1.5 },
    bomb:     { reach: 90,  arc: Math.PI * 0.8,  dmg: 90,  cd: 0.6, color: "rgba(80, 80, 80, 0.85)", inner: "#ffcc00", parts: "#ffcc00" },
    buh:      { reach: 160, arc: Math.PI * 0.85, dmg: 200, cd: 0.7, color: "rgba(255, 0, 80, 0.85)", inner: "#ffccff", parts: "#ff66aa" },
    grass:    { reach: 130, arc: Math.PI * 0.75, dmg: 110, cd: 0.7, color: "rgba(80, 200, 80, 0.85)", inner: "#d0ffb0", parts: "#90ee90" },
    lightning:{ reach: 170, arc: Math.PI * 0.7,  dmg: 180, cd: 0.55, color: "rgba(180, 100, 255, 0.9)", inner: "#e0ccff", parts: "#d0a0ff" },
    mechanic: { reach: 190, arc: Math.PI * 0.65, dmg: 220, cd: 0.6, color: "rgba(150, 160, 180, 0.9)", inner: "#d0d8e0", parts: "#c0c8d0" },
    kai:      { reach: 140, arc: Math.PI * 0.8,  dmg: 120, cd: 0.65, color: "rgba(200, 80, 220, 0.85)", inner: "#f0c0ff", parts: "#e080ff" },
    polar:    { reach: 210, arc: Math.PI * 0.75, dmg: 160, cd: 0.5, color: "rgba(150, 230, 255, 0.9)", inner: "#ffffff", parts: "#d0f8ff", freeze: 1.0 }
  };
  const cfg = configs[equippedElement];
  if (!cfg) { meleeCooldownTimer = 0.5; return; }
  meleeSlashes.push({ x: player.x, y: player.y, angle: angle, reach: cfg.reach, arc: cfg.arc, life: 0.28, maxLife: 0.28, color: cfg.color, colorInner: cfg.inner });
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    const dx = enemy.x - player.x, dy = enemy.y - player.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist <= cfg.reach + enemy.radius) {
      let d = Math.atan2(dy, dx) - angle;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      if (Math.abs(d) <= cfg.arc / 2) {
        enemy.health -= cfg.dmg;
        if (cfg.freeze) enemy.freezeTimer = Math.max(enemy.freezeTimer, cfg.freeze);
        spawnParticles(enemy.x, enemy.y, 6, cfg.parts, 130, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
  }
  meleeCooldownTimer = cfg.cd;
}

function applyExplosionDamage(x, y, radius, damage) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (Math.hypot(x - enemy.x, y - enemy.y) <= radius + enemy.radius) {
      enemy.health -= damage;
      if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
    }
  }
}

function nearestEnemyTo(x, y) {
  let best = null, bestD = Infinity;
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const d = (e.x - x) * (e.x - x) + (e.y - y) * (e.y - y);
    if (d < bestD) { bestD = d; best = e; }
  }
  return best;
}

function useGAbility() {
  if (isPaused || cutscene) return;
  if (equippedElement === "sand") {
    if (beamCooldownTimer > 0 || enemies.length === 0) return;
    const t = nearestEnemyTo(player.x, player.y);
    if (t) {
      activeLaser = { startX: player.x, startY: player.y, endX: t.x, endY: t.y, duration: 0.15 };
      spawnParticles(t.x, t.y, 10, "#ffe066", 200, 0.4, 4);
      t.health -= 100;
      if (t.health <= 0) { const isB = t.isBoss; const idx = enemies.indexOf(t); if (idx !== -1) { enemies.splice(idx, 1); onEnemyKilled({ isBoss: isB }); } }
      beamCooldownTimer = 1.0;
    }
  } else if (equippedElement === "smoke") {
    if (smokeShotCooldownTimer > 0 || enemies.length === 0) return;
    const t = nearestEnemyTo(player.x, player.y);
    if (t) {
      const a = Math.atan2(t.y - player.y, t.x - player.x);
      projectiles.push({ x: player.x, y: player.y, vx: Math.cos(a) * 450, vy: Math.sin(a) * 450, radius: 16, damage: 80, trail: [] });
      smokeShotCooldownTimer = 2.0;
    }
  } else if (equippedElement === "flame") {
    if (flameSpinCooldownTimer > 0) return;
    flameSpinActiveTimer = 3.0; flameSpinCooldownTimer = 4.0; flameSpinTickTimer = 0;
  } else if (equippedElement === "blizzard") {
    if (iceSpikeCooldownTimer > 0) return;
    const spikeW = canvas.width * 0.5, spikeH = 180;
    iceSpikes.push({ x: player.x, y: player.y, w: spikeW, h: spikeH, duration: 3.0, impactDamage: 300, contactDamage: 100, contactTick: 0.5, contactTimer: 0, impactApplied: false });
    iceSpikeCooldownTimer = 4.0;
  } else if (equippedElement === "bomb") {
    if (bombMiniCooldownTimer > 0) return;
    const radius = 90;
    const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    const tx = player.x + Math.cos(a) * 120;
    const ty = player.y + Math.sin(a) * 120;
    const ex = { x: tx, y: ty, radius: radius, life: 0.4, maxLife: 0.4, damage: 100, sparks: [] };
    for (let s = 0; s < 14; s++) ex.sparks.push({ a: Math.random() * Math.PI * 2, len: 20 + Math.random() * 30, life: 0.4 });
    bombExplosions.push(ex);
    spawnParticles(tx, ty, 16, "#ffcc44", 260, 0.5, 4);
    applyExplosionDamage(tx, ty, radius, 100);
    bombMiniCooldownTimer = 2.0;
  } else if (equippedElement === "buh") {
    if (buhBarrageCooldownTimer > 0) return;
    const total = 7;
    const baseAngle = Math.random() * Math.PI * 2;
    const target = nearestEnemyTo(player.x, player.y);
    for (let i = 0; i < total; i++) {
      let a;
      if (target) { a = Math.atan2(target.y - player.y, target.x - player.x) + (i - 3) * 0.18; }
      else { a = baseAngle + (Math.PI * 2 / total) * i; }
      buhBullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 480, vy: Math.sin(a) * 480, radius: 22, damage: 500, hitIds: new Set(), spinAngle: 0, homing: true, trail: [] });
    }
    buhBarrageCooldownTimer = 6.0;

      let a;
      if (target) { a = Math.atan2(target.y - player.y, target.x - player.x) + (i - 2) * 0.22; }

        x: player.x, y: player.y,

    polarFrostTickTimer = 0; polarFrostAge = 0;
    spawnParticles(player.x, player.y, 40, "#d0f8ff", 420, 0.8, 5);
  }
}

function rollGacha(fast) {
  const cost = fast ? 15 : 10;
  if (money < cost) {
    lastRollResult = "Need at least $" + cost + " to " + (fast ? "Fast Roll" : "Roll") + "!";
    lastRollColor = "#ff6666";
    return;
  }
  money -= cost;
  // Pick result FIRST, then animate (or skip the animation on Fast Roll)
  const rand = Math.random() * 100;
  let acc = 0, entry = GACHA_TABLE[GACHA_TABLE.length - 1];
  for (let i = 0; i < GACHA_TABLE.length; i++) {
    acc += GACHA_TABLE[i].chance;
    if (rand < acc) { entry = GACHA_TABLE[i]; break; }
  }
  const rate = entry.chance + "%";
  let msg;
  if (entry.key === "stat") {
    maxHealth += 25;
    health = maxHealth;
    msg = "Rolled: +25 Max Health (" + rate + ")!";
  } else {
    unlockedElements[entry.key] = true;
    msg = "Rolled: " + entry.name + " Ability Set (" + rate + ")!";
  }
  const result = { key: entry.key, name: entry.name, rate: rate, color: entry.color, msg: msg };
  saveGameData();
  if (fast) {
    gachaState = "idle";
    gachaResult = null;
    lastRollResult = msg;
    lastRollColor = entry.color;
  } else {
    gachaState = "shaking";
    gachaTimer = 1.0;
    gachaResult = result;
  }
}

function update(deltaTime) {
  if (cutscene) {
    cutscene.timer -= deltaTime;
    if (screenShake > 0) screenShake = Math.max(0, screenShake - deltaTime * 2);
    if (cutscene.timer <= 0) {
      const type = cutscene.type;
      cutscene = null;
      if (type === "death") {
        goToLobby();
        return;
      }
    }
    // Freeze the whole game during the boss intro and during YOU DIED
    if (cutscene && (cutscene.type === "bossIntro" || cutscene.type === "death")) return;
  }

  if (isPaused) return;
  bgTime += deltaTime;

  if (beamCooldownTimer > 0) beamCooldownTimer = Math.max(0, beamCooldownTimer - deltaTime);
  if (auraCooldownTimer > 0) auraCooldownTimer = Math.max(0, auraCooldownTimer - deltaTime);
  if (meleeCooldownTimer > 0) meleeCooldownTimer = Math.max(0, meleeCooldownTimer - deltaTime);
  if (bombMiniCooldownTimer > 0) bombMiniCooldownTimer = Math.max(0, bombMiniCooldownTimer - deltaTime);
  if (bombBigCooldownTimer > 0) bombBigCooldownTimer = Math.max(0, bombBigCooldownTimer - deltaTime);
  if (buhBarrageCooldownTimer > 0) buhBarrageCooldownTimer = Math.max(0, buhBarrageCooldownTimer - deltaTime);
  if (buhShrineCooldownTimer > 0) buhShrineCooldownTimer = Math.max(0, buhShrineCooldownTimer - deltaTime);
  if (grassShotCooldownTimer > 0) grassShotCooldownTimer = Math.max(0, grassShotCooldownTimer - deltaTime);
  if (grassFieldCooldownTimer > 0) grassFieldCooldownTimer = Math.max(0, grassFieldCooldownTimer - deltaTime);
  if (lightningBoltCooldownTimer > 0) lightningBoltCooldownTimer = Math.max(0, lightningBoltCooldownTimer - deltaTime);
  if (lightningStormCooldownTimer > 0) lightningStormCooldownTimer = Math.max(0, lightningStormCooldownTimer - deltaTime);
  if (mechanicClawCooldownTimer > 0) mechanicClawCooldownTimer = Math.max(0, mechanicClawCooldownTimer - deltaTime);
  if (mechanicSpinCooldownTimer > 0) mechanicSpinCooldownTimer = Math.max(0, mechanicSpinCooldownTimer - deltaTime);
  if (kaiOrbCooldownTimer > 0) kaiOrbCooldownTimer = Math.max(0, kaiOrbCooldownTimer - deltaTime);
  if (kaiFieldCooldownTimer > 0) kaiFieldCooldownTimer = Math.max(0, kaiFieldCooldownTimer - deltaTime);
  if (polarFrostCooldownTimer > 0) polarFrostCooldownTimer = Math.max(0, polarFrostCooldownTimer - deltaTime);
  if (polarLaserCooldownTimer > 0) polarLaserCooldownTimer = Math.max(0, polarLaserCooldownTimer - deltaTime);

  if (vBoostCooldownTimer > 0) vBoostCooldownTimer = Math.max(0, vBoostCooldownTimer - deltaTime);
  if (vBoostActiveTimer > 0) {
    vBoostActiveTimer = Math.max(0, vBoostActiveTimer - deltaTime);
    if (Math.random() < 0.5) {
      spawnParticles(player.x + (Math.random() - 0.5) * player.radius * 2, player.y + (Math.random() - 0.5) * player.radius * 2, 1, vBoostMultiplier >= 3 ? "#00ffff" : "#ffee55", 40, 0.4, 3);
    }
    if (vBoostActiveTimer <= 0) vBoostMultiplier = 1;
  }

  let applyAuraDamage = false;
  if (auraActiveTimer > 0) {
    auraActiveTimer = Math.max(0, auraActiveTimer - deltaTime);
    auraDamageTickTimer -= deltaTime;
    if (auraDamageTickTimer <= 0) { applyAuraDamage = true; auraDamageTickTimer = 0.5; }
  }
  if (activeLaser) { activeLaser.duration -= deltaTime; if (activeLaser.duration <= 0) activeLaser = null; }

  if (smokeShotCooldownTimer > 0) smokeShotCooldownTimer = Math.max(0, smokeShotCooldownTimer - deltaTime);
  if (smokeDashCooldownTimer > 0) smokeDashCooldownTimer = Math.max(0, smokeDashCooldownTimer - deltaTime);

  if (smokeDashActiveTimer > 0) {
    smokeDashActiveTimer = Math.max(0, smokeDashActiveTimer - deltaTime);
    player.speed = player.baseSpeed * 1.5;
    smokeBombSpawnTimer -= deltaTime;
    if (smokeBombSpawnTimer <= 0) {
      const puffs = [];
      for (let i = 0; i < 5; i++) puffs.push({ a: Math.random() * Math.PI * 2, d: Math.random() * 20, life: 1 + Math.random() * 1.0, size: 15 + Math.random() * 20 });
      smokeBombs.push({ x: player.x, y: player.y, radius: 45, duration: 2.0, damageTickTimer: 0, puffs: puffs });
      smokeBombSpawnTimer = 0.3;
    }
    if (Math.random() < 0.6) spawnParticles(player.x, player.y, 1, "#888888", 40, 0.5, 5);
  } else {
    player.speed = player.baseSpeed;
  }
  if (vBoostActiveTimer > 0) player.speed = player.baseSpeed * vBoostMultiplier;

  if (flameSpinCooldownTimer > 0) flameSpinCooldownTimer = Math.max(0, flameSpinCooldownTimer - deltaTime);
  if (flameOrbCooldownTimer > 0) flameOrbCooldownTimer = Math.max(0, flameOrbCooldownTimer - deltaTime);
  if (iceSpikeCooldownTimer > 0) iceSpikeCooldownTimer = Math.max(0, iceSpikeCooldownTimer - deltaTime);
  if (blizzardFieldCooldownTimer > 0) blizzardFieldCooldownTimer = Math.max(0, blizzardFieldCooldownTimer - deltaTime);

  if (flameSpinActiveTimer > 0) {
    flameSpinActiveTimer = Math.max(0, flameSpinActiveTimer - deltaTime);
    flameSpinAngle += deltaTime * 12;
    flameSpinTickTimer -= deltaTime;
    if (flameSpinTickTimer <= 0) {
      flameSpinTickTimer = 0.3;
      const beamLen = 140;
      const l1x = player.x + Math.cos(flameSpinAngle) * beamLen;
      const l1y = player.y + Math.sin(flameSpinAngle) * beamLen;
      const l2x = player.x + Math.cos(flameSpinAngle + Math.PI) * beamLen;
      const l2y = player.y + Math.sin(flameSpinAngle + Math.PI) * beamLen;
      const HB = 90;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (Math.hypot(enemy.x - l1x, enemy.y - l1y) <= HB + enemy.radius || Math.hypot(enemy.x - l2x, enemy.y - l2y) <= HB + enemy.radius) {
          enemy.health -= 100;
          spawnParticles(enemy.x, enemy.y, 4, "#ffaa33", 130, 0.4, 3);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
  }

  if (mechanicSpinActiveTimer > 0) {
    mechanicSpinActiveTimer = Math.max(0, mechanicSpinActiveTimer - deltaTime);
    mechanicSpinAngle += deltaTime * 10;
    mechanicSpinTickTimer -= deltaTime;
    if (mechanicSpinTickTimer <= 0) {
      mechanicSpinTickTimer = 0.15;
      const reach = player.radius + 110;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
        if (dist <= reach + enemy.radius) {
          enemy.health -= 300;
          spawnParticles(enemy.x, enemy.y, 5, "#d0d8e0", 160, 0.35, 3);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
  }

  // POLAR FROST WAVE (G): hits every enemy on the whole map
  if (polarFrostActiveTimer > 0) {
    polarFrostActiveTimer = Math.max(0, polarFrostActiveTimer - deltaTime);
    polarFrostAge += deltaTime;
    polarFrostTickTimer -= deltaTime;
    let tickGuard = 0;
    while (polarFrostTickTimer <= 0 && tickGuard++ < 3) {
      polarFrostTickTimer += POLAR_FROST_TICK;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.health -= POLAR_FROST_DAMAGE;
        enemy.freezeTimer = Math.max(enemy.freezeTimer, 1.5);
        if (Math.random() < 0.3) spawnParticles(enemy.x, enemy.y, 2, "#d0f8ff", 140, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
    if (polarFrostTickTimer < 0) polarFrostTickTimer = 0;
  }

  // POLAR LASER (F): giant 2-armed spinning beam that follows the player
  if (polarLaserActiveTimer > 0) {
    polarLaserActiveTimer = Math.max(0, polarLaserActiveTimer - deltaTime);
    polarLaserAngle += deltaTime * POLAR_LASER_SPIN;
    const pLen = polarLaserLength();
    const pax = Math.cos(polarLaserAngle) * pLen, pay = Math.sin(polarLaserAngle) * pLen;
    for (let i = enemies.length - 1; i >= 0; i--) {
      const enemy = enemies[i];
      enemy.polarLaserCd = (enemy.polarLaserCd || 0) - deltaTime;
      if (enemy.polarLaserCd > 0) continue;
      const pReach = POLAR_LASER_WIDTH / 2 + enemy.radius;
      if (distToSegment(enemy.x, enemy.y, player.x, player.y, player.x + pax, player.y + pay) <= pReach ||
          distToSegment(enemy.x, enemy.y, player.x, player.y, player.x - pax, player.y - pay) <= pReach) {
        enemy.health -= POLAR_LASER_DAMAGE;
        enemy.polarLaserCd = POLAR_LASER_HIT_INTERVAL;
        spawnParticles(enemy.x, enemy.y, 6, "#d0f8ff", 180, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
  }

  // KAI ORBS (homing)
  for (let i = kaiOrbs.length - 1; i >= 0; i--) {
    const b = kaiOrbs[i];
    if (b.homing) {
      const t = nearestEnemyTo(b.x, b.y);
      if (t) {
        const cur = Math.atan2(b.vy, b.vx);
        const want = Math.atan2(t.y - b.y, t.x - b.x);
        let diff = want - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.min(Math.abs(diff), 5.0 * deltaTime) * Math.sign(diff);
        const na = cur + turn;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }
    b.trail.push({ x: b.x, y: b.y, life: 0.3 });
    if (b.trail.length > 8) b.trail.shift();
    for (let t = 0; t < b.trail.length; t++) b.trail[t].life -= deltaTime;
    b.x += b.vx * deltaTime; b.y += b.vy * deltaTime;
    b.spinAngle += deltaTime * 8;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (b.hitIds.has(enemy.id)) continue;
      if (Math.hypot(b.x - enemy.x, b.y - enemy.y) <= b.radius + enemy.radius) {
        enemy.health -= b.damage;
        b.hitIds.add(enemy.id);
        spawnParticles(enemy.x, enemy.y, 6, "#e080ff", 160, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
    if (b.x < -100 || b.x > canvas.width + 100 || b.y < -100 || b.y > canvas.height + 100) kaiOrbs.splice(i, 1);
  }

  // KAI FIELDS (gas)
  for (let i = kaiFields.length - 1; i >= 0; i--) {
    const f = kaiFields[i];
    f.duration -= deltaTime;
    f.tickTimer -= deltaTime;
    f.swirl = (f.swirl || 0) + deltaTime * 0.8;
    for (const p of f.particles) {
      p.life -= deltaTime;
      if (p.life <= 0) { p.life = 0.6 + Math.random() * 0.6; p.a = Math.random() * Math.PI * 2; p.d = Math.random() * f.radius; }
    }
    if (f.tickTimer <= 0) {
      f.tickTimer = f.tickInterval;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        if (Math.hypot(f.x - enemy.x, f.y - enemy.y) <= f.radius + enemy.radius) {
          enemy.health -= f.damage;
          spawnParticles(enemy.x, enemy.y, 3, "#e080ff", 100, 0.4, 3);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    if (f.duration <= 0) kaiFields.splice(i, 1);
  }

  for (let i = meleeSlashes.length - 1; i >= 0; i--) {
    meleeSlashes[i].life -= deltaTime;
    if (meleeSlashes[i].life <= 0) meleeSlashes.splice(i, 1);
  }
  for (let i = bombExplosions.length - 1; i >= 0; i--) {
    const ex = bombExplosions[i];
    ex.life -= deltaTime;
    if (ex.sparks) for (let s = 0; s < ex.sparks.length; s++) ex.sparks[s].life -= deltaTime;
    if (ex.life <= 0) bombExplosions.splice(i, 1);
  }
  for (let i = particleFx.length - 1; i >= 0; i--) {
    const p = particleFx[i];
    p.x += p.vx * deltaTime; p.y += p.vy * deltaTime;
    p.vx *= 0.94; p.vy *= 0.94;
    p.life -= deltaTime;
    if (p.life <= 0) particleFx.splice(i, 1);
  }

  for (let i = mechanicClaws.length - 1; i >= 0; i--) {
    const c = mechanicClaws[i];
    c.life -= deltaTime;
    c.extend = Math.min(c.maxExtend, c.extend + 800 * deltaTime);
    c.x += c.vx * deltaTime; c.y += c.vy * deltaTime;
    c.trail.push({ x: c.x, y: c.y, life: 0.25 });
    if (c.trail.length > 8) c.trail.shift();
    for (let t = 0; t < c.trail.length; t++) c.trail[t].life -= deltaTime;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (c.hitIds.has(enemy.id)) continue;
      if (Math.hypot(c.x - enemy.x, c.y - enemy.y) <= c.radius + enemy.radius) {
        enemy.health -= c.damage;
        c.hitIds.add(enemy.id);
        spawnParticles(enemy.x, enemy.y, 10, "#c0c8d0", 220, 0.5, 4);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
    if (c.life <= 0 || c.x < -150 || c.x > canvas.width + 150 || c.y < -150 || c.y > canvas.height + 150) mechanicClaws.splice(i, 1);
  }

  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    const b = lightningBolts[i];
    b.trail.push({ x: b.x, y: b.y, life: 0.3 });
    if (b.trail.length > 12) b.trail.shift();
    for (let t = 0; t < b.trail.length; t++) b.trail[t].life -= deltaTime;
    b.x += b.vx * deltaTime; b.y += b.vy * deltaTime;
    b.life -= deltaTime;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (b.hitIds.has(enemy.id)) continue;
      if (Math.hypot(b.x - enemy.x, b.y - enemy.y) <= b.radius + enemy.radius) {
        enemy.health -= b.damage;
        b.hitIds.add(enemy.id);
        spawnParticles(enemy.x, enemy.y, 10, "#d0a0ff", 220, 0.5, 4);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
    if (b.life <= 0 || b.x < -100 || b.x > canvas.width + 100 || b.y < -100 || b.y > canvas.height + 100) lightningBolts.splice(i, 1);
  }
  for (let i = lightningStrikes.length - 1; i >= 0; i--) {
    lightningStrikes[i].life -= deltaTime;
    if (lightningStrikes[i].life <= 0) lightningStrikes.splice(i, 1);
  }

  for (let i = buhBullets.length - 1; i >= 0; i--) {
    const b = buhBullets[i];
    if (b.homing) {
      const t = nearestEnemyTo(b.x, b.y);
      if (t) {
        const cur = Math.atan2(b.vy, b.vx);
        const want = Math.atan2(t.y - b.y, t.x - b.x);
        let diff = want - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const turn = Math.min(Math.abs(diff), 4.0 * deltaTime) * Math.sign(diff);
        const na = cur + turn;
        const sp = Math.hypot(b.vx, b.vy);
        b.vx = Math.cos(na) * sp; b.vy = Math.sin(na) * sp;
      }
    }
    b.trail.push({ x: b.x, y: b.y, life: 0.35 });
    if (b.trail.length > 10) b.trail.shift();
    for (let tI = 0; tI < b.trail.length; tI++) b.trail[tI].life -= deltaTime;
    b.x += b.vx * deltaTime; b.y += b.vy * deltaTime;
    b.spinAngle += deltaTime * 8;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (b.hitIds.has(enemy.id)) continue;
      if (Math.hypot(b.x - enemy.x, b.y - enemy.y) <= b.radius + enemy.radius) {
        enemy.health -= b.damage;
        b.hitIds.add(enemy.id);
        spawnParticles(enemy.x, enemy.y, 8, "#ff66aa", 200, 0.5, 4);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
    if (b.x < -100 || b.x > canvas.width + 100 || b.y < -100 || b.y > canvas.height + 100) buhBullets.splice(i, 1);
  }

  for (let i = buhShrines.length - 1; i >= 0; i--) {
    const shrine = buhShrines[i];
    shrine.duration -= deltaTime;
    shrine.tickTimer -= deltaTime;
    shrine.rune += deltaTime * 2;
    if (shrine.tickTimer <= 0) {
      shrine.tickTimer = shrine.tickInterval;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        if (Math.hypot(shrine.x - enemy.x, shrine.y - enemy.y) <= shrine.radius + enemy.radius) {
          enemy.health -= shrine.damage;
          shrineSlashFx.push({ x: enemy.x, y: enemy.y, angle: Math.random() * Math.PI * 2, life: 0.12, maxLife: 0.12, len: 20 + Math.random() * 10 });
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    if (shrine.duration <= 0) buhShrines.splice(i, 1);
  }
  for (let i = shrineSlashFx.length - 1; i >= 0; i--) {
    shrineSlashFx[i].life -= deltaTime;
    if (shrineSlashFx[i].life <= 0) shrineSlashFx.splice(i, 1);
  }

  for (let i = grassShards.length - 1; i >= 0; i--) {
    const s = grassShards[i];
    s.trail.push({ x: s.x, y: s.y, life: 0.3 });
    if (s.trail.length > 8) s.trail.shift();
    for (let t = 0; t < s.trail.length; t++) s.trail[t].life -= deltaTime;
    s.x += s.vx * deltaTime; s.y += s.vy * deltaTime;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (s.hitIds.has(enemy.id)) continue;
      if (Math.hypot(s.x - enemy.x, s.y - enemy.y) <= s.radius + enemy.radius) {
        enemy.health -= s.damage;
        s.hitIds.add(enemy.id);
        spawnParticles(enemy.x, enemy.y, 6, "#90ee90", 160, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
      }
    }
    if (s.x < -50 || s.x > canvas.width + 50 || s.y < -50 || s.y > canvas.height + 50) grassShards.splice(i, 1);
  }
  for (let i = grassFields.length - 1; i >= 0; i--) {
    const f = grassFields[i];
    f.duration -= deltaTime;
    f.tickTimer -= deltaTime;
    for (const b of f.blades) b.sway += deltaTime * 3;
    if (f.tickTimer <= 0) {
      f.tickTimer = f.tickInterval;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        if (Math.hypot(f.x - enemy.x, f.y - enemy.y) <= f.radius + enemy.radius) {
          enemy.health -= f.damage;
          spawnParticles(enemy.x, enemy.y, 3, "#90ee90", 100, 0.35, 3);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    if (f.duration <= 0) grassFields.splice(i, 1);
  }

  for (let i = landMines.length - 1; i >= 0; i--) {
    const m = landMines[i];
    m.blink = (m.blink || 0) + deltaTime * 5;
    if (m.exploded) { m.explodeTimer -= deltaTime; if (m.explodeTimer <= 0) landMines.splice(i, 1); continue; }
    m.duration -= deltaTime;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (Math.hypot(m.x - enemy.x, m.y - enemy.y) <= m.radius + enemy.radius) {
        m.exploded = true; m.explodeTimer = 0.35;
        const ex = { x: m.x, y: m.y, radius: 70, life: 0.35, maxLife: 0.35, damage: m.damage, sparks: [] };
        for (let s = 0; s < 10; s++) ex.sparks.push({ a: Math.random() * Math.PI * 2, len: 15 + Math.random() * 25, life: 0.35 });
        bombExplosions.push(ex);
        spawnParticles(m.x, m.y, 12, "#ffcc44", 200, 0.4, 3);
        applyExplosionDamage(m.x, m.y, 70, m.damage);
        break;
      }
    }
    if (m.duration <= 0 && !m.exploded) landMines.splice(i, 1);
  }

  for (let i = iceSpikes.length - 1; i >= 0; i--) {
    const spike = iceSpikes[i];
    spike.duration -= deltaTime;
    if (!spike.impactApplied) {
      spike.impactApplied = true;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        const insideH = Math.abs(enemy.x - spike.x) <= spike.w / 2 + enemy.radius && Math.abs(enemy.y - spike.y) <= spike.h / 2 + enemy.radius;
        const insideV = Math.abs(enemy.y - spike.y) <= spike.w / 2 + enemy.radius && Math.abs(enemy.x - spike.x) <= spike.h / 2 + enemy.radius;
        if (insideH || insideV) {
          enemy.health -= spike.impactDamage;
          enemy.freezeTimer = Math.max(enemy.freezeTimer, 3.0);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    spike.contactTimer -= deltaTime;
    if (spike.contactTimer <= 0) {
      spike.contactTimer = spike.contactTick;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        const insideH = Math.abs(enemy.x - spike.x) <= spike.w / 2 + enemy.radius && Math.abs(enemy.y - spike.y) <= spike.h / 2 + enemy.radius;
        const insideV = Math.abs(enemy.y - spike.y) <= spike.w / 2 + enemy.radius && Math.abs(enemy.x - spike.x) <= spike.h / 2 + enemy.radius;
        if (insideH || insideV) {
          enemy.health -= spike.contactDamage;
          enemy.freezeTimer = Math.max(enemy.freezeTimer, 1.5);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    if (spike.duration <= 0) iceSpikes.splice(i, 1);
  }

  for (let i = blizzardFields.length - 1; i >= 0; i--) {
    const field = blizzardFields[i];
    field.duration -= deltaTime;
    field.swirl = (field.swirl || 0) + deltaTime * 1.2;
    if (!field.impactApplied) {
      field.impactApplied = true;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        if (Math.hypot(enemy.x - field.x, enemy.y - field.y) <= field.radius + enemy.radius) {
          enemy.health -= field.impactDamage;
          enemy.freezeTimer = Math.max(enemy.freezeTimer, 3.0);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    field.contactTimer -= deltaTime;
    if (field.contactTimer <= 0) {
      field.contactTimer = field.contactTick;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        if (Math.hypot(enemy.x - field.x, enemy.y - field.y) <= field.radius + enemy.radius) {
          enemy.health -= field.contactDamage;
          enemy.freezeTimer = Math.max(enemy.freezeTimer, 1.5);
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    if (field.duration <= 0) blizzardFields.splice(i, 1);
  }

  let hx = 0, vy = 0;
  if (keys.w) vy -= 1; if (keys.s) vy += 1;
  if (keys.a) hx -= 1; if (keys.d) hx += 1;
  if (hx !== 0 && vy !== 0) { hx *= 0.7071; vy *= 0.7071; }
  player.x += hx * player.speed * deltaTime;
  player.y += vy * player.speed * deltaTime;
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    if (!p.trail) p.trail = [];
    p.trail.push({ x: p.x, y: p.y, life: 0.3 });
    if (p.trail.length > 8) p.trail.shift();
    for (let t = 0; t < p.trail.length; t++) p.trail[t].life -= deltaTime;
    p.x += p.vx * deltaTime; p.y += p.vy * deltaTime;
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (Math.hypot(p.x - enemy.x, p.y - enemy.y) < p.radius + enemy.radius) {
        enemy.health -= p.damage;
        spawnParticles(p.x, p.y, 8, "#cccccc", 150, 0.35, 3);
        projectiles.splice(i, 1);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        break;
      }
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.x += b.vx * deltaTime; b.y += b.vy * deltaTime;
    if (b.x < -50 || b.x > canvas.width + 50 || b.y < -50 || b.y > canvas.height + 50) { enemyBullets.splice(i, 1); continue; }
    if (Math.hypot(b.x - player.x, b.y - player.y) <= b.radius + player.radius) {
      health -= b.damage;
      spawnParticles(b.x, b.y, 8, "#cc44ff", 150, 0.35, 3);
      enemyBullets.splice(i, 1);
      if (health <= 0) { startCutscene("death", 2.0, {}); return; }
    }
  }

  for (let i = smokeBombs.length - 1; i >= 0; i--) {
    const b = smokeBombs[i];
    b.duration -= deltaTime;
    b.damageTickTimer -= deltaTime;
    if (b.damageTickTimer <= 0) {
      b.damageTickTimer = 0.4;
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j];
        if (Math.hypot(b.x - enemy.x, b.y - enemy.y) <= b.radius + enemy.radius) {
          enemy.health -= 20;
          if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        }
      }
    }
    if (b.duration <= 0) smokeBombs.splice(i, 1);
  }

  for (let i = fireOrbs.length - 1; i >= 0; i--) {
    const orb = fireOrbs[i];
    orb.x += orb.vx * deltaTime; orb.y += orb.vy * deltaTime;
    orb.duration -= deltaTime;
    orb.spinAngle += deltaTime * 5;
    if (Math.random() < 0.7) spawnParticles(orb.x, orb.y, 1, "#ffaa33", 40, 0.5, 3);
    for (let j = enemies.length - 1; j >= 0; j--) {
      const enemy = enemies[j];
      if (orb.hitIds.has(enemy.id)) continue;
      const dist = Math.hypot(orb.x - enemy.x, orb.y - enemy.y);
      if (dist <= orb.radius + enemy.radius) {
        const dmg = Math.min(orb.damage, orb.maxDamage - orb.damageDealt);
        if (dmg <= 0) break;
        enemy.health -= dmg;
        orb.damageDealt += dmg;
        orb.hitIds.add(enemy.id);
        spawnParticles(enemy.x, enemy.y, 8, "#ffcc44", 180, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(j, 1); onEnemyKilled({ isBoss: isB }); }
        if (orb.damageDealt >= orb.maxDamage) break;
      }
    }
    if (orb.damageDealt >= orb.maxDamage || orb.duration <= 0) fireOrbs.splice(i, 1);
  }

  enemySpawnTimer += deltaTime;
  if (enemySpawnTimer >= enemySpawnInterval) { spawnEnemy(); enemySpawnTimer = 0; }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const enemy = enemies[i];
    if (enemy.freezeTimer > 0) { enemy.freezeTimer = Math.max(0, enemy.freezeTimer - deltaTime); enemy.speed = enemy.baseSpeed * 0.4; }
    else enemy.speed = enemy.baseSpeed;

    if (enemy.isRusher) {
      enemy.dashTimer -= deltaTime;
      if (enemy.dashTimer <= 0 && !enemy.dashing) { enemy.dashing = true; enemy.dashDuration = 0.7; enemy.dashTimer = 3.0; }
      if (enemy.dashing) { enemy.dashDuration -= deltaTime; if (enemy.dashDuration <= 0) enemy.dashing = false; }
    }

    const dx = player.x - enemy.x;
    const dy = player.y - enemy.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const curSpeed = enemy.dashing ? enemy.speed * 2.6 : enemy.speed;
    if (dist > 0) {
      enemy.x += (dx / dist) * curSpeed * deltaTime;
      enemy.y += (dy / dist) * curSpeed * deltaTime;
    }
    if (enemy.dashing) spawnParticles(enemy.x, enemy.y, 1, "#ff88ff", 30, 0.3, 3);
    if (enemy.isBoss) {
      enemy.shootTimer -= deltaTime;
      if (enemy.shootTimer <= 0) {
        enemy.shootTimer = 1.8;
        const a = Math.atan2(player.y - enemy.y, player.x - enemy.x);
        for (let s = -1; s <= 1; s++) {
          const spread = a + s * 0.25;
          enemyBullets.push({ x: enemy.x, y: enemy.y, vx: Math.cos(spread) * 220, vy: Math.sin(spread) * 220, radius: 10, damage: 30, color: "#cc44ff" });
        }
      }
    }
    if (equippedElement === "sand" && auraActiveTimer > 0 && applyAuraDamage) {
      if (dist <= 120 + enemy.radius) {
        enemy.health -= 25;
        spawnParticles(enemy.x, enemy.y, 4, "#ffd166", 100, 0.4, 3);
        if (enemy.health <= 0) { const isB = enemy.isBoss; enemies.splice(i, 1); onEnemyKilled({ isBoss: isB }); continue; }
      }
    }
    if (enemy.hitCooldown > 0) enemy.hitCooldown -= deltaTime;
    if (dist < player.radius + enemy.radius) {
      if (enemy.hitCooldown <= 0) {
        health -= enemy.damage;
        enemy.hitCooldown = 0.5;
        spawnParticles(player.x, player.y, 6, "#ff5555", 150, 0.35, 3);
        if (health <= 0) { startCutscene("death", 2.0, {}); return; }
      }
    }
  }
}

// ---- DRAW ----

function drawBackground() {
  const g = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.5, 0, canvas.width * 0.5, canvas.height * 0.5, Math.max(canvas.width, canvas.height) * 0.8);
  g.addColorStop(0, "#0b0a1f"); g.addColorStop(0.5, "#050414"); g.addColorStop(1, "#000000");
  ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const t = bgTime * 0.15;
  for (let n = 0; n < 3; n++) {
    const px = canvas.width * (0.5 + 0.35 * Math.cos(t + n * 2.1));
    const py = canvas.height * (0.5 + 0.35 * Math.sin(t * 1.2 + n * 1.7));
    const radius = Math.max(canvas.width, canvas.height) * 0.45;
    const ng = ctx.createRadialGradient(px, py, 0, px, py, radius);
    if (n === 0) { ng.addColorStop(0, "rgba(120, 60, 200, 0.10)"); ng.addColorStop(1, "rgba(120, 60, 200, 0)"); }
    else if (n === 1) { ng.addColorStop(0, "rgba(60, 120, 200, 0.08)"); ng.addColorStop(1, "rgba(60, 120, 200, 0)"); }
    else { ng.addColorStop(0, "rgba(200, 40, 120, 0.06)"); ng.addColorStop(1, "rgba(200, 40, 120, 0)"); }
    ctx.fillStyle = ng; ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
  ctx.strokeStyle = "rgba(90, 70, 140, 0.10)"; ctx.lineWidth = 1;
  const gs = 60;
  const ox = (bgTime * 8) % gs, oy = (bgTime * 8) % gs;
  for (let x = -ox; x < canvas.width; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
  for (let y = -oy; y < canvas.height; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
  for (const s of starfield) {
    const tw = 0.5 + 0.5 * Math.sin(bgTime * 2 + s.tw);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(200, 190, 255, " + (s.a * tw).toFixed(3) + ")"; ctx.fill();
  }
  const vg = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, Math.min(canvas.width, canvas.height) * 0.35, canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.75);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.75)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawEnemy(enemy) {
  const now = performance.now() / 1000;
  const pulse = 0.5 + 0.5 * Math.sin(now * 3 + (enemy.pulsePhase || 0));
  const frozen = enemy.freezeTimer > 0;
  let baseColor, glowColor;
  if (frozen) { baseColor = "#9fe4ff"; glowColor = "rgba(120, 220, 255, 0.85)"; }
  else if (enemy.element) { baseColor = ELEMENTAL_AURAS[enemy.element]; glowColor = hexToRgba(baseColor, 0.9); }
  else if (enemy.isBoss) { baseColor = "#c060ff"; glowColor = "rgba(180, 80, 255, 0.9)"; }
  else if (enemy.isTank) { baseColor = "#3ea663"; glowColor = "rgba(80, 220, 130, 0.85)"; }
  else if (enemy.isRusher) { baseColor = "#dd44dd"; glowColor = "rgba(255, 100, 255, 0.9)"; }
  else if (enemy.type === "fast") { baseColor = "#ffaa33"; glowColor = "rgba(255, 170, 40, 0.85)"; }
  else { baseColor = "#ff4455"; glowColor = "rgba(255, 60, 80, 0.85)"; }
  const glowR = enemy.radius * (enemy.dashing || enemy.element ? 3.0 : 2.2);
  const og = ctx.createRadialGradient(enemy.x, enemy.y, enemy.radius * 0.5, enemy.x, enemy.y, glowR);
  og.addColorStop(0, glowColor); og.addColorStop(0.5, glowColor.replace(/[\d.]+\)$/, "0.25)")); og.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = og; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, glowR, 0, Math.PI * 2); ctx.fill();
  const bg = ctx.createRadialGradient(enemy.x - enemy.radius * 0.3, enemy.y - enemy.radius * 0.3, enemy.radius * 0.1, enemy.x, enemy.y, enemy.radius);
  bg.addColorStop(0, "#ffffff"); bg.addColorStop(0.35, baseColor); bg.addColorStop(1, "#330000");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = glowColor; ctx.lineWidth = enemy.isBoss ? 4 : (enemy.isTank ? 3.5 : (enemy.dashing ? 3 : 2));
  ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius * (0.35 + pulse * 0.15), 0, Math.PI * 2);
  ctx.fillStyle = "rgba(255, 255, 255, " + (0.55 + pulse * 0.3).toFixed(2) + ")"; ctx.fill();
  if (enemy.element) {
    const ec = ELEMENTAL_AURAS[enemy.element];
    ctx.save();
    ctx.shadowColor = ec; ctx.shadowBlur = 14;
    ctx.strokeStyle = hexToRgba(ec, 0.9); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius + 6 + pulse * 3, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = ec;
    for (let k = 0; k < 4; k++) {
      const a = now * 2.5 + k * Math.PI / 2;
      ctx.beginPath(); ctx.arc(enemy.x + Math.cos(a) * (enemy.radius + 11), enemy.y + Math.sin(a) * (enemy.radius + 11), 2.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (enemy.isBoss) {
    ctx.strokeStyle = "#ffdd00"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius + 8, 0, Math.PI * 2); ctx.stroke();
    const ang = now * 1.5;
    for (let k = 0; k < 6; k++) {
      const a = ang + k * Math.PI / 3;
      ctx.beginPath(); ctx.arc(enemy.x + Math.cos(a) * (enemy.radius + 8), enemy.y + Math.sin(a) * (enemy.radius + 8), 3, 0, Math.PI * 2);
      ctx.fillStyle = "#ffdd00"; ctx.fill();
    }
  }
  if (enemy.isTank) {
    ctx.strokeStyle = "rgba(160, 220, 180, 0.9)"; ctx.lineWidth = 3;
    const seg = 6; const ang = now * 0.6;
    for (let k = 0; k < seg; k++) {
      const a0 = ang + (k / seg) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius + 4, a0, a0 + (Math.PI * 2 / seg) * 0.5); ctx.stroke();
    }
  }
  if (enemy.isRusher) {
    ctx.fillStyle = "rgba(255, 150, 255, 0.85)";
    const ang = now * 3;
    for (let k = 0; k < 5; k++) {
      const a = ang + k * Math.PI * 2 / 5;
      const px = enemy.x + Math.cos(a) * (enemy.radius + 3);
      const py = enemy.y + Math.sin(a) * (enemy.radius + 3);
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(a + 0.4) * 5, py + Math.sin(a + 0.4) * 5);
      ctx.lineTo(px + Math.cos(a - 0.4) * 5, py + Math.sin(a - 0.4) * 5);

    }
  }
  if (enemy.type === "fast" && !frozen) {
    ctx.strokeStyle = "rgba(255, 170, 40, 0.55)"; ctx.lineWidth = 2;
    const ang = Math.atan2(player.y - enemy.y, player.x - enemy.x);
    for (let k = 0; k < 3; k++) {
      const off = (k - 1) * 4;
      const sx = enemy.x + Math.cos(ang + Math.PI / 2) * off;
      const sy = enemy.y + Math.sin(ang + Math.PI / 2) * off;
      ctx.beginPath(); ctx.moveTo(sx, sy);
      ctx.lineTo(sx - Math.cos(ang) * (12 + pulse * 4), sy - Math.sin(ang) * (12 + pulse * 4)); ctx.stroke();
    }
  }
  if (frozen) {
    ctx.fillStyle = "rgba(220, 245, 255, 0.95)";
    for (let k = 0; k < 4; k++) {
      const a = now * 2 + k * Math.PI / 2;
      ctx.beginPath(); ctx.arc(enemy.x + Math.cos(a) * (enemy.radius + 6), enemy.y + Math.sin(a) * (enemy.radius + 6), 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  if (enemy.health < enemy.maxHealth) {
    const barW = enemy.isBoss ? 70 : (enemy.isTank ? 40 : (enemy.isRusher ? 32 : 26));
    const barH = enemy.isBoss ? 7 : (enemy.isTank ? 5 : 4);
    const bx = enemy.x - barW / 2;
    const by = enemy.y - enemy.radius - 12;
    ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(bx - 1, by - 1, barW + 2, barH + 2);
    ctx.fillStyle = "#222"; ctx.fillRect(bx, by, barW, barH);
    let hpColor = "#ff3333";
    if (enemy.isBoss) hpColor = "#cc44ff";
    else if (enemy.isTank) hpColor = "#3ea663";
    else if (enemy.isRusher) hpColor = "#dd44dd";
    else if (enemy.element) hpColor = ELEMENTAL_AURAS[enemy.element];
    ctx.fillStyle = hpColor;
    ctx.fillRect(bx, by, (enemy.health / enemy.maxHealth) * barW, barH);
  }
}

function drawHome() {

        for (let i = 0; i < 8; i++) { const sa = Math.random() * Math.PI * 2; homeFx.push({ type: "spark", x: b.x, y: b.y, vx: Math.cos(sa) * 150, vy: Math.sin(sa) * 150, life: 0.5, maxLife: 0.5, color: "#ffcc44" }); }
      } else if (b.key === "buh") {
        for (let i = 0; i < 7; i++) { const sa = (Math.PI * 2 / 7) * i; homeFx.push({ type: "buh", x: b.x, y: b.y, vx: Math.cos(sa) * 220, vy: Math.sin(sa) * 220, life: 1.5, maxLife: 1.5 }); }
      } else if (b.key === "grass") {
        for (let i = 0; i < 3; i++) { const sa = ang + (i - 1) * 0.2; homeFx.push({ type: "grass", x: b.x, y: b.y, vx: Math.cos(sa) * 260, vy: Math.sin(sa) * 260, life: 1.2, maxLife: 1.2 }); }
      } else if (b.key === "lightning") {

      } else if (b.key === "polar") {

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();

      const len = 120;
      const l1x = f.x + Math.cos(f.angle) * len, l1y = f.y + Math.sin(f.angle) * len;
      const l2x = f.x + Math.cos(f.angle + Math.PI) * len, l2y = f.y + Math.sin(f.angle + Math.PI) * len;
      ctx.strokeStyle = "rgba(255, 69, 0, 0.9)"; ctx.lineWidth = 18;
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(l1x, l1y); ctx.lineTo(l2x, l2y); ctx.stroke();
      ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 6; ctx.stroke();
    } else if (f.type === "ice") {
      ctx.strokeStyle = "rgba(120, 200, 255, 0.9)"; ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.moveTo(f.x - 150, f.y); ctx.lineTo(f.x + 150, f.y);
      ctx.moveTo(f.x, f.y - 150); ctx.lineTo(f.x, f.y + 150); ctx.stroke();
    } else if (f.type === "boom") {

      g.addColorStop(0.5, "rgba(255, 140, 0, 0.7)");
      g.addColorStop(1, "rgba(255, 60, 0, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "spark") {
      ctx.fillStyle = f.color; ctx.beginPath(); ctx.arc(f.x, f.y, 3, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "buh") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 16);
      g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#ff2288"); g.addColorStop(1, "rgba(120, 0, 40, 0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 16, 0, Math.PI * 2); ctx.fill();
    } else if (f.type === "grass") {
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 12);

      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = "#e0ccff"; ctx.lineWidth = 2; ctx.stroke();

  ctx.lineTo(btnX + btnW, btnY + btnH - r);
  ctx.quadraticCurveTo(btnX + btnW, btnY + btnH, btnX + btnW - r, btnY + btnH);
  ctx.lineTo(btnX + r, btnY + btnH);
  ctx.quadraticCurveTo(btnX, btnY + btnH, btnX, btnY + btnH - r);
  ctx.lineTo(btnX, btnY + r);

  ctx.beginPath();
  ctx.moveTo(btnX + r, btnY);
  ctx.lineTo(btnX + btnW - r, btnY);
  ctx.quadraticCurveTo(btnX + btnW, btnY, btnX + btnW, btnY + r);
  ctx.lineTo(btnX + btnW, btnY + btnH - r);
  ctx.quadraticCurveTo(btnX + btnW, btnY + btnH, btnX + btnW - r, btnY + btnH);
  ctx.lineTo(btnX + r, btnY + btnH);
  ctx.quadraticCurveTo(btnX, btnY + btnH, btnX, btnY + btnH - r);

  ctx.fillStyle = "#ffffff"; ctx.font = "bold 36px Arial";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

function draw() {
  let shakeX = 0, shakeY = 0;
  if (screenShake > 0) { shakeX = (Math.random() - 0.5) * screenShake * 20; shakeY = (Math.random() - 0.5) * screenShake * 20; }
  ctx.save();
  ctx.translate(shakeX, shakeY);

  drawBackground();

  // Smoke bombs
  for (const b of smokeBombs) {
    if (b.puffs) for (const p of b.puffs) {
      p.life -= 0.016;
      if (p.life <= 0) { p.life = 1 + Math.random() * 1.0; p.a = Math.random() * Math.PI * 2; p.d = Math.random() * 20; }
    }
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
    g.addColorStop(0, "rgba(200, 200, 200, 0.55)");
    g.addColorStop(1, "rgba(120, 120, 120, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    if (b.puffs) for (const p of b.puffs) {
      const px = b.x + Math.cos(p.a) * p.d, py = b.y + Math.sin(p.a) * p.d;
      const pg = ctx.createRadialGradient(px, py, 0, px, py, p.size);
      pg.addColorStop(0, "rgba(220, 220, 220, 0.55)"); pg.addColorStop(1, "rgba(120, 120, 120, 0)");
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Land mines
  for (const m of landMines) {
    if (m.exploded) continue;
    const blink = 0.5 + 0.5 * Math.sin(m.blink || 0);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.radius + blink * 3, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(60, 60, 60, 0.85)"; ctx.fill();
    ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255, 60, 60, " + (0.5 + blink * 0.5) + ")"; ctx.fill();
  }

  // Grass fields
  for (const f of grassFields) {
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius);
    g.addColorStop(0, "rgba(80, 220, 80, 0.35)");
    g.addColorStop(0.6, "rgba(50, 160, 50, 0.28)");
    g.addColorStop(1, "rgba(30, 100, 30, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(120, 240, 120, 0.75)"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.stroke();
    for (const b of f.blades) {

  // KAI FIELDS (gas)
  for (const f of kaiFields) {

    ctx.beginPath(); ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2); ctx.stroke();

  // Grass shards
  for (const s of grassShards) {

    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, s.radius * 1.6, 0, Math.PI * 2); ctx.fill();

  // BUH shrine
  for (const shrine of buhShrines) {
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 100);
    const g = ctx.createRadialGradient(shrine.x, shrine.y, 0, shrine.x, shrine.y, shrine.radius);

    ctx.strokeStyle = "rgba(255, 40, 100, 0.95)"; ctx.lineWidth = 4; ctx.stroke();

  for (const fx of shrineSlashFx) {

  // Blizzard field

    g.addColorStop(0.6, "rgba(100, 200, 255, 0.30)");
    g.addColorStop(1, "rgba(60, 120, 200, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(field.x, field.y, field.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(150, 230, 255, 0.9)"; ctx.lineWidth = 4; ctx.stroke();
  }

  // Ice spikes
  for (const spike of iceSpikes) {
    const halfW = spike.w / 2, halfH = spike.h / 2;
    ctx.fillStyle = "rgba(120, 200, 255, 0.85)";
    ctx.fillRect(spike.x - halfW, spike.y - halfH / 2, spike.w, spike.h / 2);
    ctx.fillRect(spike.x - halfH / 2, spike.y - halfW, spike.h / 2, spike.w);
    ctx.strokeStyle = "rgba(220, 245, 255, 0.95)"; ctx.lineWidth = 4;
    ctx.strokeRect(spike.x - halfW, spike.y - halfH / 2, spike.w, spike.h / 2);
    ctx.strokeRect(spike.x - halfH / 2, spike.y - halfW, spike.h / 2, spike.w);
  }

  // Fire orbs
  for (const orb of fireOrbs) {
    ctx.save();
    ctx.translate(orb.x, orb.y); ctx.rotate(orb.spinAngle);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, orb.radius);
    g.addColorStop(0, "#ffffaa"); g.addColorStop(0.5, "rgba(255, 100, 0, 0.95)"); g.addColorStop(1, "rgba(255, 60, 0, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, orb.radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#ffcc00"; ctx.lineWidth = 6; ctx.stroke();
    ctx.restore();
  }

  // BUH bullets
  for (const b of buhBullets) {

    ctx.strokeStyle = "#ff66aa"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }

  // KAI ORBS
  for (const b of kaiOrbs) {
    if (b.trail) for (let i = 0; i < b.trail.length; i++) {

    ctx.strokeStyle = "#e0a0ff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = "rgba(255, 220, 255, 0.9)"; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {

      ctx.moveTo(Math.cos(a) * b.radius * 0.5, Math.sin(a) * b.radius * 0.5);

  // MECHANIC CLAWS

    ctx.fillStyle = "rgba(140, 150, 170, 0.95)";
    ctx.strokeStyle = "#e0e8f0"; ctx.lineWidth = 2;
    ctx.fillRect(-16, -12, 30, 24);
    ctx.strokeRect(-16, -12, 30, 24);
    ctx.beginPath();

    ctx.restore();

  // MECHANIC SPIN
  if (mechanicSpinActiveTimer > 0) {
    ctx.save();
    ctx.translate(player.x, player.y);
    const armCount = 4;
    for (let k = 0; k < armCount; k++) {
      const a = mechanicSpinAngle + k * Math.PI * 2 / armCount;
      ctx.save();
      ctx.rotate(a);
      ctx.fillStyle = "rgba(140, 150, 170, 0.95)";
      ctx.strokeStyle = "#e0e8f0"; ctx.lineWidth = 2;
      ctx.fillRect(player.radius - 4, -8, 100, 16);
      ctx.strokeRect(player.radius - 4, -8, 100, 16);

      ctx.fillStyle = "rgba(180, 190, 210, 0.95)";
      ctx.beginPath();
      ctx.moveTo(tipX, -16); ctx.lineTo(tipX + 20, -6); ctx.lineTo(tipX + 20, 6); ctx.lineTo(tipX, 16); ctx.lineTo(tipX - 4, 0);

  // Lightning bolts
  for (const b of lightningBolts) {

      ctx.fillStyle = "#c060ff";

    ctx.translate(b.x, b.y); ctx.rotate(b.angle);
    ctx.shadowColor = "#c060ff"; ctx.shadowBlur = 25;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, b.radius * 1.6);
    g.addColorStop(0, "#ffffff"); g.addColorStop(0.4, "#d0a0ff"); g.addColorStop(1, "rgba(100, 0, 200, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, b.radius * 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(200, 150, 255, 0.95)"; ctx.lineWidth = 3;

    ctx.moveTo(-b.radius * 1.4, 0);

  for (const s of lightningStrikes) {

      g.addColorStop(1, "rgba(100, 0, 200, 0)");

  // Bomb explosions
  for (const ex of bombExplosions) {

    g.addColorStop(1, "rgba(255, 60, 0, 0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();

  // Particles
  for (const p of particleFx) {

    ctx.globalAlpha = a;

  }

  // Sand aura
  if (equippedElement === "sand" && auraActiveTimer > 0) {
    const g = ctx.createRadialGradient(player.x, player.y, 0, player.x, player.y, 120);
    g.addColorStop(0, "rgba(255, 220, 100, 0.35)"); g.addColorStop(1, "rgba(224, 192, 100, 0.10)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(player.x, player.y, 120, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(240, 200, 50, 0.95)"; ctx.lineWidth = 4; ctx.stroke();
  }

  // Flame spin
  if (equippedElement === "flame" && flameSpinActiveTimer > 0) {

    ctx.strokeStyle = "#ffff00"; ctx.lineWidth = 8; ctx.stroke();
    ctx.restore();
  }

  // Polar frost wave (full map)
  if (polarFrostActiveTimer > 0) {
    const fade = Math.max(0, Math.min(1, polarFrostActiveTimer / 0.8, polarFrostAge / 0.3));
    ctx.save();
    ctx.globalAlpha = 0.16 * fade * (0.85 + 0.15 * Math.sin(polarFrostAge * 12));

    ctx.lineWidth = 6;
    for (let k = 0; k < 3; k++) {

  // Polar laser (giant spin)
  if (polarLaserActiveTimer > 0) {
    const pLen = polarLaserLength();
    const lAlpha = Math.max(0, Math.min(1, (POLAR_LASER_DURATION - polarLaserActiveTimer) / 0.25, polarLaserActiveTimer / 0.4));

  // Player
  const plrBase = equippedElement === "smoke" ? "#778899" :
                  equippedElement === "flame" ? "#ff4500" :

                  equippedElement === "bomb" ? "#aaaaaa" :
                  equippedElement === "buh" ? "#ff2288" :

  const pg = ctx.createRadialGradient(player.x - player.radius * 0.3, player.y - player.radius * 0.3, player.radius * 0.1, player.x, player.y, player.radius);

  for (const p of projectiles) {

  for (const b of enemyBullets) {

      { key: "smoke", name: "SMOKE", rate: "17%", color: "#00bfff", unlocked: unlockedElements.smoke },
      { key: "grass", name: "GRASS", rate: "14%", color: "#4ec44e", unlocked: unlockedElements.grass },
      { key: "kai", name: "KAI", rate: "11%", color: "#d870ff", unlocked: unlockedElements.kai },
      { key: "bomb", name: "BOMB", rate: "5%", color: "#ffcc00", unlocked: unlockedElements.bomb },
      { key: "flame", name: "FLAME", rate: "5%", color: "#ff4500", unlocked: unlockedElements.flame },
      { key: "lightning", name: "LIGHT", rate: "4%", color: "#c060ff", unlocked: unlockedElements.lightning },
      { key: "blizzard", name: "BLIZ", rate: "1%", color: "#7ec8ff", unlocked: unlockedElements.blizzard },
      { key: "buh", name: "BUH", rate: "0.1%", color: "#ff2288", unlocked: unlockedElements.buh },
      { key: "polar", name: "POLAR", rate: "0.05%", color: "#d0f8ff", unlocked: unlockedElements.polar },
      { key: "stat", name: "STAT", rate: "15.85%", color: "#20c95c", unlocked: true }
    ];

    for (let i = 0; i < elems.length; i++) {
      const e = elems[i];
      const x = startX + (cardW + gap) * i;
      const isEq = equippedElement === e.key;
      ctx.fillStyle = !e.unlocked ? "#222222" : (isEq ? e.color : "#333333");
      ctx.fillRect(x, cardY, cardW, cardH);
      ctx.strokeStyle = e.unlocked && e.key === "buh" ? "#ff2288" :
                         e.unlocked && e.key === "blizzard" ? "#7ec8ff" :
                         e.unlocked && e.key === "polar" ? "#d0f8ff" :
                         e.unlocked && e.key === "lightning" ? "#c060ff" :
                         e.unlocked && e.key === "kai" ? "#d870ff" : "#ffffff";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, cardY, cardW, cardH);
      ctx.fillStyle = "#ffffff"; ctx.font = "bold 9px Arial";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(e.name, x + cardW / 2, cardY + 25);
      ctx.font = "8px Arial";
      const label = !e.unlocked ? "[" + e.rate + "]" : (isEq ? "[EQ]" : "[EQP]");
      ctx.fillText(label, x + cardW / 2, cardY + 55);
    }

    if (lastRollResult && gachaState === "idle") {
      ctx.fillStyle = lastRollColor; ctx.font = "bold 18px Arial";
      ctx.fillText(lastRollResult, canvas.width / 2, cy + 250);
    }
    ctx.fillStyle = "#9b30ff"; ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; ctx.strokeRect(btnX, btnY, btnW, btnH);
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("GAME", btnX + btnW / 2, btnY + btnH / 2);
  }

  // Death cutscene (drawn on top of everything)
  if (cutscene && cutscene.type === "death") {
    const t = cutscene.timer / cutscene.maxTimer;
    const alpha = Math.min(1, (1 - t) * 2);
    ctx.fillStyle = "rgba(60, 0, 0, " + (alpha * 0.85) + ")";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.shadowColor = "#ff0000"; ctx.shadowBlur = 60;
    ctx.fillStyle = "#ff2222";
    ctx.font = "bold 110px Arial";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("YOU DIED", canvas.width / 2, canvas.height / 2);
    ctx.font = "24px Arial";
    ctx.fillStyle = "#ffaaaa";
    ctx.fillText("returning to lobby...", canvas.width / 2, canvas.height / 2 + 80);
    ctx.restore();
  }
}

function gameLoop(now) {
  const dt = Math.min(Math.max(0, (now - lastTime) / 1000), 0.1);
  lastTime = now;

  // Gacha animation state machine
  if (gachaState !== "idle") {
    gachaTimer -= dt;
    if (gachaState === "shaking" && gachaTimer <= 0) {
      gachaState = "opening";
      gachaTimer = 1.2;
    } else if (gachaState === "opening" && gachaTimer <= 0) {
      gachaState = "reveal";
      gachaTimer = 1.5;
      if (gachaResult) { lastRollResult = gachaResult.msg; lastRollColor = gachaResult.color; }
    } else if (gachaState === "reveal" && gachaTimer <= 0) {
      gachaState = "idle";
    }
  }

  if (inHome) drawHome();
  else { update(dt); draw(); }
  requestAnimationFrame(gameLoop);
}

window.addEventListener("click", function (e) {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (inHome) {
    const btnW = 260, btnH = 76;
    const btnX = canvas.width / 2 - btnW / 2;
    const btnY = canvas.height / 2 + 40;
    if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
      inHome = false; homeBalls = []; homeFx = [];
      startWave();
    }
    return;
  }

  if (!isPaused || cutscene) return;

  const btnX = canvas.width - 180, btnY = canvas.height / 2 - 25, btnW = 140, btnH = 50;
  if (mx >= btnX && mx <= btnX + btnW && my >= btnY && my <= btnY + btnH) {
    currentScreen = (currentScreen === "game") ? "gacha" : "game";
    gachaState = "idle";
    return;
  }

  if (currentScreen === "gacha" && gachaState === "idle") {
    const lay = gachaLayout();
    const cy = lay.cy;
    const inBtn = function (b) { return mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h; };
    if (inBtn(lay.roll)) { rollGacha(false); return; }
    if (inBtn(lay.fast)) { rollGacha(true); return; }
    const cardW = 62, cardH = 76, gap = 4;
    const totalW = cardW * 11 + gap * 10;
    const startX = canvas.width / 2 - totalW / 2;
    const cardY = cy + 145;
    const keys2 = ["sand", "smoke", "grass", "kai", "bomb", "flame", "lightning", "blizzard", "buh", "polar", "stat"];
    if (my >= cardY && my <= cardY + cardH) {
      for (let i = 0; i < keys2.length; i++) {
        const x = startX + (cardW + gap) * i;
        if (mx >= x && mx <= x + cardW) {
          const k = keys2[i];
          if (k === "sand" || unlockedElements[k]) {
            equippedElement = k;
            saveGameData();
            return;
          }
        }
      }
    }
  }
});

window.addEventListener("keydown", function (e) {
  if (inHome) return;
  const k = e.key.toLowerCase();
  if (k === "1") {
    isPaused = !isPaused;
    if (!isPaused) currentScreen = "game";
    e.preventDefault();
    return;
  }
  if (cutscene) return;
  if (k in keys) { keys[k] = true; e.preventDefault(); }
  if (k === "g") { useGAbility(); e.preventDefault(); }
  if (k === "f") { useFAbility(); e.preventDefault(); }
  if (k === "v") { useVBoost(); e.preventDefault(); }
  if (k === " " || k === "spacebar" || e.code === "Space") { useMelee(); e.preventDefault(); }
});

window.addEventListener("keyup", function (e) {
  const k = e.key.toLowerCase();
  if (k in keys) { keys[k] = false; e.preventDefault(); }
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
